name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The package has no dependencies, so no install step is needed.
      - name: Verify vendored skills and plugin provider
        run: npm run verify

      - name: Check the manifest is publishable
        run: npm pack --dry-run
